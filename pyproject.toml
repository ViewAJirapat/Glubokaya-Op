[project]
name = "agent-swarm"
version = "0.1.0"
description = "Closed-loop coding-agent harness: worktree per task, tamper-checked gates, hidden acceptance tests."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
swarm = "swarm.cli:main"

# The dev group doubles as the verification toolchain for target repos:
# the harness runs ruff / mypy / pytest from this venv inside each worktree.
[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swarm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
extend-exclude = ["demo", "tasks", "work", ".worktrees", "runs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["swarm"]
