<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 680" width="680" height="680" role="img" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>swarm harness: one task</title>
  <desc>Create a worktree, check the baseline (else invalid_task), let the agent edit, autofix and guard, run the gates and hidden tests. On pass the harness commits the branch; on fail the errors are fed back and the agent retries, up to four attempts, after which the worktree and patch are kept.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #F1EFE8; stroke: #888780; stroke-width: 0.5; }
    .teal { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
    .coral { fill: #FAECE7; stroke: #993C1D; stroke-width: 0.5; }
    .th { font-size: 14px; font-weight: 600; fill: #2C2C2A; }
    .ts { font-size: 12px; fill: #5F5E5A; }
    .teal-t { fill: #085041; } .teal-s { fill: #0F6E56; }
    .coral-t { fill: #712B13; } .coral-s { fill: #993C1D; }
    .arr { stroke: #73726C; stroke-width: 1.5; fill: none; }
    .head { stroke: #73726C; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1F1E1D; }
      .box { fill: #2C2C2A; stroke: #B4B2A9; }
      .teal { fill: #085041; stroke: #5DCAA5; }
      .coral { fill: #712B13; stroke: #F0997B; }
      .th { fill: #F1EFE8; } .ts { fill: #B4B2A9; }
      .teal-t { fill: #E1F5EE; } .teal-s { fill: #9FE1CB; }
      .coral-t { fill: #FAECE7; } .coral-s { fill: #F5C4B3; }
      .arr, .head { stroke: #9C9A92; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect class="bg" width="680" height="680"/>

  <rect class="box" x="170" y="30" width="280" height="56" rx="8"/>
  <text class="th" x="310" y="48" text-anchor="middle" dominant-baseline="central">Create worktree</text>
  <text class="ts" x="310" y="68" text-anchor="middle" dominant-baseline="central">Isolated copy, own branch</text>
  <line class="arr" x1="310" y1="86" x2="310" y2="114" marker-end="url(#arrow)"/>

  <rect class="box" x="170" y="116" width="280" height="56" rx="8"/>
  <text class="th" x="310" y="134" text-anchor="middle" dominant-baseline="central">Baseline check</text>
  <text class="ts" x="310" y="154" text-anchor="middle" dominant-baseline="central">Base green, hidden tests red</text>
  <line class="arr" x1="450" y1="144" x2="498" y2="144" marker-end="url(#arrow)"/>
  <rect class="coral" x="500" y="122" width="140" height="44" rx="8"/>
  <text class="th coral-t" x="570" y="144" text-anchor="middle" dominant-baseline="central">invalid_task</text>
  <line class="arr" x1="310" y1="172" x2="310" y2="200" marker-end="url(#arrow)"/>

  <rect class="box" x="170" y="202" width="280" height="56" rx="8"/>
  <text class="th" x="310" y="220" text-anchor="middle" dominant-baseline="central">Agent edits</text>
  <text class="ts" x="310" y="240" text-anchor="middle" dominant-baseline="central">Local brain or Claude</text>
  <line class="arr" x1="310" y1="258" x2="310" y2="286" marker-end="url(#arrow)"/>

  <rect class="box" x="170" y="288" width="280" height="56" rx="8"/>
  <text class="th" x="310" y="306" text-anchor="middle" dominant-baseline="central">Autofix + guard</text>
  <text class="ts" x="310" y="326" text-anchor="middle" dominant-baseline="central">Format, undo cheating edits</text>
  <line class="arr" x1="310" y1="344" x2="310" y2="372" marker-end="url(#arrow)"/>

  <rect class="box" x="170" y="374" width="280" height="56" rx="8"/>
  <text class="th" x="310" y="392" text-anchor="middle" dominant-baseline="central">Gates + hidden tests</text>
  <text class="ts" x="310" y="412" text-anchor="middle" dominant-baseline="central">ruff, mypy, pytest, hidden</text>
  <line class="arr" x1="270" y1="430" x2="215" y2="478" marker-end="url(#arrow)"/>
  <line class="arr" x1="350" y1="430" x2="455" y2="478" marker-end="url(#arrow)"/>

  <rect class="teal" x="90" y="480" width="220" height="56" rx="8"/>
  <text class="th teal-t" x="200" y="498" text-anchor="middle" dominant-baseline="central">Pass</text>
  <text class="ts teal-s" x="200" y="518" text-anchor="middle" dominant-baseline="central">Harness commits the branch</text>

  <rect class="coral" x="370" y="480" width="220" height="56" rx="8"/>
  <text class="th coral-t" x="480" y="498" text-anchor="middle" dominant-baseline="central">Fail</text>
  <text class="ts coral-s" x="480" y="518" text-anchor="middle" dominant-baseline="central">Errors fed back to agent</text>

  <path class="arr" d="M590 508 L620 508 L620 230 L452 230" marker-end="url(#arrow)"/>
  <text class="ts" x="612" y="370" text-anchor="end">Retry, max 4</text>

  <line class="arr" x1="200" y1="536" x2="200" y2="578" marker-end="url(#arrow)"/>
  <line class="arr" x1="480" y1="536" x2="480" y2="578" marker-end="url(#arrow)"/>

  <rect class="box" x="80" y="580" width="240" height="56" rx="8"/>
  <text class="th" x="200" y="598" text-anchor="middle" dominant-baseline="central">Results</text>
  <text class="ts" x="200" y="618" text-anchor="middle" dominant-baseline="central">runs/ logs, bench, integrate</text>

  <rect class="box" x="370" y="580" width="220" height="56" rx="8"/>
  <text class="th" x="480" y="598" text-anchor="middle" dominant-baseline="central">Out of tries</text>
  <text class="ts" x="480" y="618" text-anchor="middle" dominant-baseline="central">Worktree + patch kept</text>
</svg>
