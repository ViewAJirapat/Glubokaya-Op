<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 762" width="680" height="762" role="img" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>swarm harness: one task</title>
  <desc>The hidden tests (the answer key) live in tasks/target/id/acceptance, outside the worktree, so the agent can't see them. They must fail in the baseline check (else invalid_task) and run as their own step after the gates. The target's rules (swarm.toml and task.toml: protected paths, plus a task scope and import rules when the target sets them, as shopapi does) are also outside the agent's edit tools: the guard undoes edits to protected paths or outside the scope, and the gates include the import-rule check. On pass the harness commits only the paths it checked (in the Docker sandbox, with read-only checks, exactly what passed); on fail the errors are fed back and the agent retries, up to four attempts, after which the worktree and patch are kept. Four is the total number of attempts.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #F1EFE8; stroke: #888780; stroke-width: 0.5; }
    .purple { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.5; }
    .coral { fill: #FAECE7; stroke: #993C1D; stroke-width: 0.5; }
    .th { font-size: 14px; font-weight: 600; fill: #2C2C2A; }
    .ts { font-size: 12px; fill: #5F5E5A; }
    .purple-t { fill: #3C3489; } .purple-s { fill: #534AB7; }
    .coral-t { fill: #712B13; } .coral-s { fill: #993C1D; }
    .arr { stroke: #73726C; stroke-width: 1.5; fill: none; }
    .head { stroke: #73726C; }
    .dash { stroke-dasharray: 4 3; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1F1E1D; }
      .box { fill: #2C2C2A; stroke: #B4B2A9; }
      .purple { fill: #3C3489; stroke: #AFA9EC; }
      .coral { fill: #712B13; stroke: #F0997B; }
      .th { fill: #F1EFE8; } .ts { fill: #B4B2A9; }
      .purple-t { fill: #EEEDFE; } .purple-s { fill: #CECBF6; }
      .coral-t { fill: #FAECE7; } .coral-s { fill: #F5C4B3; }
      .arr, .head { stroke: #9C9A92; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect class="bg" width="680" height="762"/>

  <rect class="box" x="100" y="30" width="240" height="56" rx="8"/>
  <text class="th" x="220" y="48" text-anchor="middle" dominant-baseline="central">Create worktree</text>
  <text class="ts" x="220" y="68" text-anchor="middle" dominant-baseline="central">Isolated copy, own branch</text>
  <line class="arr" x1="220" y1="86" x2="220" y2="114" marker-end="url(#arrow)"/>

  <rect class="box" x="100" y="116" width="240" height="56" rx="8"/>
  <text class="th" x="220" y="134" text-anchor="middle" dominant-baseline="central">Baseline check</text>
  <text class="ts" x="220" y="154" text-anchor="middle" dominant-baseline="central">Base green, hidden tests red</text>
  <line class="arr" x1="340" y1="126" x2="378" y2="126" marker-end="url(#arrow)"/>
  <rect class="coral" x="380" y="104" width="140" height="44" rx="8"/>
  <text class="th coral-t" x="450" y="126" text-anchor="middle" dominant-baseline="central">invalid_task</text>
  <line class="arr" x1="220" y1="172" x2="220" y2="200" marker-end="url(#arrow)"/>

  <rect class="box" x="100" y="202" width="240" height="56" rx="8"/>
  <text class="th" x="220" y="220" text-anchor="middle" dominant-baseline="central">Agent edits</text>
  <text class="ts" x="220" y="240" text-anchor="middle" dominant-baseline="central">Local brain or Claude</text>
  <line class="arr" x1="220" y1="258" x2="220" y2="286" marker-end="url(#arrow)"/>

  <rect class="box" x="100" y="288" width="240" height="56" rx="8"/>
  <text class="th" x="220" y="306" text-anchor="middle" dominant-baseline="central">Autofix + guard</text>
  <text class="ts" x="220" y="326" text-anchor="middle" dominant-baseline="central">Format, undo disallowed edits</text>
  <line class="arr" x1="220" y1="344" x2="220" y2="372" marker-end="url(#arrow)"/>

  <rect class="box" x="100" y="374" width="240" height="56" rx="8"/>
  <text class="th" x="220" y="392" text-anchor="middle" dominant-baseline="central">Gates</text>
  <text class="ts" x="220" y="412" text-anchor="middle" dominant-baseline="central">ruff, mypy, tests (+ import rules)</text>
  <line class="arr" x1="220" y1="430" x2="220" y2="458" marker-end="url(#arrow)"/>

  <rect class="purple dash" x="380" y="292" width="220" height="134" rx="8"/>
  <text class="th purple-t" x="490" y="314" text-anchor="middle" dominant-baseline="central">Target rules</text>
  <text class="ts purple-s" x="490" y="334" text-anchor="middle" dominant-baseline="central">Protected paths</text>
  <text class="ts purple-s" x="490" y="352" text-anchor="middle" dominant-baseline="central">Task scope, import rules</text>
  <text class="ts purple-s" x="490" y="370" text-anchor="middle" dominant-baseline="central">(if the target sets them)</text>
  <text class="ts purple-s" x="490" y="392" text-anchor="middle" dominant-baseline="central">swarm.toml, task.toml</text>
  <text class="ts purple-s" x="490" y="410" text-anchor="middle" dominant-baseline="central">Agent can't edit them</text>
  <line class="arr dash" x1="380" y1="316" x2="342" y2="316" marker-end="url(#arrow)"/>
  <line class="arr dash" x1="380" y1="402" x2="342" y2="402" marker-end="url(#arrow)"/>

  <rect class="purple" x="100" y="460" width="240" height="56" rx="8"/>
  <text class="th purple-t" x="220" y="478" text-anchor="middle" dominant-baseline="central">Hidden tests</text>
  <text class="ts purple-s" x="220" y="498" text-anchor="middle" dominant-baseline="central">Run against the worktree</text>

  <rect class="purple dash" x="400" y="452" width="240" height="72" rx="8"/>
  <text class="th purple-t" x="520" y="470" text-anchor="middle" dominant-baseline="central">Answer key</text>
  <text class="ts purple-s" x="520" y="488" text-anchor="middle" dominant-baseline="central">tasks/&lt;target&gt;/&lt;id&gt;/acceptance/</text>
  <text class="ts purple-s" x="520" y="506" text-anchor="middle" dominant-baseline="central">Agent can't see it</text>
  <line class="arr dash" x1="400" y1="488" x2="342" y2="488" marker-end="url(#arrow)"/>
  <path class="arr dash" d="M620 452 L620 164 L342 164" marker-end="url(#arrow)"/>

  <line class="arr" x1="190" y1="516" x2="165" y2="564" marker-end="url(#arrow)"/>
  <line class="arr" x1="250" y1="516" x2="370" y2="564" marker-end="url(#arrow)"/>

  <rect class="coral" x="60" y="566" width="200" height="56" rx="8"/>
  <text class="th coral-t" x="160" y="584" text-anchor="middle" dominant-baseline="central">Fail</text>
  <text class="ts coral-s" x="160" y="604" text-anchor="middle" dominant-baseline="central">Errors fed back to agent</text>

  <rect class="box" x="280" y="566" width="220" height="56" rx="8"/>
  <text class="th" x="390" y="584" text-anchor="middle" dominant-baseline="central">Pass</text>
  <text class="ts" x="390" y="604" text-anchor="middle" dominant-baseline="central">Commits only the checked paths</text>

  <path class="arr" d="M60 594 L30 594 L30 230 L98 230" marker-end="url(#arrow)"/>
  <text class="ts" x="38" y="350">Up to</text>
  <text class="ts" x="38" y="366">4 attempts</text>

  <line class="arr" x1="160" y1="622" x2="160" y2="664" marker-end="url(#arrow)"/>
  <line class="arr" x1="390" y1="622" x2="390" y2="664" marker-end="url(#arrow)"/>

  <rect class="box" x="60" y="666" width="200" height="56" rx="8"/>
  <text class="th" x="160" y="684" text-anchor="middle" dominant-baseline="central">Out of tries</text>
  <text class="ts" x="160" y="704" text-anchor="middle" dominant-baseline="central">Worktree + patch kept</text>

  <rect class="box" x="280" y="666" width="220" height="56" rx="8"/>
  <text class="th" x="390" y="684" text-anchor="middle" dominant-baseline="central">Results</text>
  <text class="ts" x="390" y="704" text-anchor="middle" dominant-baseline="central">runs/ logs, bench, integrate</text>
</svg>
