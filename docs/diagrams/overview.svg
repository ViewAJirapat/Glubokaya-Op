<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 370" width="680" height="370" role="img" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>Glubokaya-Op overview</title>
  <desc>Two entry points, the swarm harness and aider-local, both drive Aider (the hands), which uses a local Ollama model (the brain): qwen2.5-coder 14B or 7B, qwen3-coder 30B (partly on the CPU with 12 GB of VRAM) or deepseek-coder-v2 16B. aider-local defaults to the 14B; the harness's default engine is local-7b, and benchmarks pick one with -e. The harness can optionally use Claude Code instead.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #F1EFE8; stroke: #888780; stroke-width: 0.5; }
    .purple { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.5; }
    .teal { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
    .th { font-size: 14px; font-weight: 600; fill: #2C2C2A; }
    .ts { font-size: 12px; fill: #5F5E5A; }
    .purple-t { fill: #3C3489; } .purple-s { fill: #534AB7; }
    .teal-t { fill: #085041; } .teal-s { fill: #0F6E56; }
    .arr { stroke: #73726C; stroke-width: 1.5; fill: none; }
    .head { stroke: #73726C; }
    .dash { stroke-dasharray: 4 3; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1F1E1D; }
      .box { fill: #2C2C2A; stroke: #B4B2A9; }
      .purple { fill: #3C3489; stroke: #AFA9EC; }
      .teal { fill: #085041; stroke: #5DCAA5; }
      .th { fill: #F1EFE8; } .ts { fill: #B4B2A9; }
      .purple-t { fill: #EEEDFE; } .purple-s { fill: #CECBF6; }
      .teal-t { fill: #E1F5EE; } .teal-s { fill: #9FE1CB; }
      .arr, .head { stroke: #9C9A92; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect class="bg" width="680" height="370"/>

  <rect class="purple" x="60" y="30" width="250" height="56" rx="8"/>
  <text class="th purple-t" x="185" y="48" text-anchor="middle" dominant-baseline="central">swarm harness</text>
  <text class="ts purple-s" x="185" y="68" text-anchor="middle" dominant-baseline="central">Tasks in, checked commits out</text>

  <rect class="teal" x="370" y="30" width="250" height="56" rx="8"/>
  <text class="th teal-t" x="495" y="48" text-anchor="middle" dominant-baseline="central">aider-local</text>
  <text class="ts teal-s" x="495" y="68" text-anchor="middle" dominant-baseline="central">You chat, the AI edits</text>

  <line class="arr dash" x1="165" y1="86" x2="138" y2="148" marker-end="url(#arrow)"/>
  <line class="arr" x1="240" y1="86" x2="300" y2="148" marker-end="url(#arrow)"/>
  <line class="arr" x1="440" y1="86" x2="380" y2="148" marker-end="url(#arrow)"/>

  <rect class="box dash" x="40" y="150" width="180" height="56" rx="8"/>
  <text class="th" x="130" y="168" text-anchor="middle" dominant-baseline="central">Claude Code</text>
  <text class="ts" x="130" y="188" text-anchor="middle" dominant-baseline="central">Optional cloud brain</text>

  <rect class="box" x="245" y="150" width="190" height="56" rx="8"/>
  <text class="th" x="340" y="168" text-anchor="middle" dominant-baseline="central">Aider</text>
  <text class="ts" x="340" y="188" text-anchor="middle" dominant-baseline="central">The hands: edits files</text>

  <line class="arr" x1="340" y1="206" x2="340" y2="268" marker-end="url(#arrow)"/>

  <rect class="box" x="215" y="270" width="250" height="56" rx="8"/>
  <text class="th" x="340" y="288" text-anchor="middle" dominant-baseline="central">Ollama · local models</text>
  <text class="ts" x="340" y="308" text-anchor="middle" dominant-baseline="central">The brain: 14B, 30B, 7B or 16B</text>
</svg>
