title = "Fix missing last page in paginate()"
type = "fix"
files = ["src/shopkit/pagination.py"]
prompt = """
Users report that the last page disappears when the number of items is not an exact
multiple of `per_page`. Fix `paginate()` in `src/shopkit/pagination.py`.

Required behaviour:
- `pages` is the number of pages needed to hold every item, rounded up
  (11 items at 5 per page -> 3 pages). An empty sequence has exactly 1 page (an empty page 1).
- `has_next` is False on the last page and True on every page before it.
- Raise `ValueError` if `per_page < 1`, if `page < 1`, or if `page > pages`.

Do not change the signature of `paginate()` or the fields of `Page`.
"""
